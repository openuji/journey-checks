services:
  nextcloud:
    image: ${NEXTCLOUD_IMAGE:?provided by stack}
    ports:
      - ${NEXTCLOUD_TABLES_PORT}:80
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: JourneyAdmin2026!
      NEXTCLOUD_TRUSTED_DOMAINS: host.docker.internal localhost 127.0.0.1
    volumes:
      - nextcloud:/var/www/html
volumes:
  nextcloud: {}
