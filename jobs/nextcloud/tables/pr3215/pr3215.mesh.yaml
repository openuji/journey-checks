        effects:
          urn:effect:page-missing-source:source-cleared:
            - id: read-board
              client: owner
              path: /ocs/v2.php/apps/tables/api/2/contexts/{{context}}/pages/board
              poll: {}
              assertions:
                - pointer: /ocs/data/widgets
                  includes: { title: Gone soon, source: null }
