            method: POST
            path: /index.php/apps/tables/api/1/tables
            json:
              title: Archive
            capture:
              archive: /id
            cleanup:
              - id: delete-archive
                client: owner
                method: DELETE
                path: /index.php/apps/tables/api/1/tables/{{archive}}
                status: [200, 404]
          - id: create-application
            client: owner
            method: POST
            path: /ocs/v2.php/apps/tables/api/2/contexts
            json:
              name: Team board
              iconName: equalizer
              description: ""
              nodes:
                - { id: "{{table}}", type: 0, permissions: 1 }
            capture:
              context: /ocs/data/id
            cleanup:
              - id: delete-application
                client: owner
                method: DELETE
                path: /ocs/v2.php/apps/tables/api/2/contexts/{{context}}
                status: [200, 404]
          - id: create-drafts
            client: owner
            method: POST
            path: /ocs/v2.php/apps/tables/api/2/contexts/{{context}}/pages
            json: { title: Drafts, slug: drafts }
          - id: create-backlog
            client: owner
            method: POST
            path: /ocs/v2.php/apps/tables/api/2/contexts/{{context}}/pages
            json: { title: Backlog, slug: backlog }
        effects:
          urn:effect:page-arrange:widgets-saved:
            - id: read-drafts
              client: owner
              path: /ocs/v2.php/apps/tables/api/2/contexts/{{context}}/pages/drafts
              poll: {}
              assertions:
                - pointer: /ocs/data/widgets
                  length: 2
                - pointer: /ocs/data/widgets
                  includes: { type: header, settings: { heading: Welcome } }
                - pointer: /ocs/data/widgets
                  includes: { type: data, gridX: 1, gridWidth: 11 }
  page-cancel:
    timeoutMs: 600000
    services:
      - tables-install
    journeys:
      - id: login
        source: ujg/page-cancel.ujg.jsonld
        select: urn:journey:page-cancel:login
        adapter: web
      - id: pages
        source: ujg/page-cancel.ujg.jsonld
        select: urn:journey:page-cancel:pages
        adapter: web
    profiles:
      - id: default
        journeys: { login: default, pages: default }
      - id: keyboard-only
        journeys: { login: keyboard-only, pages: keyboard-only }
    environment:
      use: "@openuji/journey-environment-http/plugin"
      options:
        clients: *clients
        setup: &drafts
          - id: create-owner
            client: provisioner
            method: POST
