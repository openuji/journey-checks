        adapter: web
      - id: pages
        source: ujg/page-missing-source.ujg.jsonld
        select: urn:journey:page-missing-source:pages
        adapter: web
    profiles:
      - id: default
        journeys: { login: default, seed: default, pages: default }
      - id: keyboard-only
        journeys: { login: keyboard-only, seed: default, pages: keyboard-only }
    environment:
      use: "@openuji/journey-environment-http/plugin"
      options:
