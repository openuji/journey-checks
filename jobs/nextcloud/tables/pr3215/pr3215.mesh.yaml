          - id: share-read-only
            client: owner
            method: POST
            path: /index.php/apps/tables/api/1/shares
            json:
              nodeId: "{{context}}"
              nodeType: context
              receiver: journey-viewer
              receiverType: user
              permissionRead: true
              permissionCreate: false
              permissionUpdate: false
              permissionDelete: false
              permissionManage: false
              displayMode: 2
  page-missing-source:
    timeoutMs: 900000
    services:
      - tables-install
    journeys:
      - id: login
        source: ujg/page-missing-source.ujg.jsonld
        select: urn:journey:page-missing-source:login
        adapter: web
      - id: seed
        source: ujg/page-missing-source.ujg.jsonld
