        journeys: { login: keyboard-only, pages: keyboard-only }
    environment:
      use: "@openuji/journey-environment-http/plugin"
      options:
        clients: *clients
        setup: *drafts
        effects:
          urn:effect:page-manage:renamed:
            - id: read-drafts
              client: owner
              path: /ocs/v2.php/apps/tables/api/2/contexts/{{context}}/pages/drafts
              poll: {}
              assertions:
                - pointer: /ocs/data/title
                  equals: Drafts archive
                - pointer: /ocs/data/slug
                  equals: drafts
          urn:effect:page-manage:deleted:
            - id: read-drafts
              client: owner
              path: /ocs/v2.php/apps/tables/api/2/contexts/{{context}}/pages/drafts
              status: 404
            - id: read-table
              client: owner
              path: /index.php/apps/tables/api/1/tables/{{table}}
  page-viewer:
    timeoutMs: 900000
    services:
      - tables-install
    journeys:
      - id: login
        source: ujg/page-viewer.ujg.jsonld
