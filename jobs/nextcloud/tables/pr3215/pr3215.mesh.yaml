        adapter: web
      - id: viewer-login
        source: ujg/page-viewer.ujg.jsonld
        select: urn:journey:page-viewer:viewer-login
        adapter: web
      - id: pages
        source: ujg/page-viewer.ujg.jsonld
        select: urn:journey:page-viewer:pages
        adapter: web
    profiles:
      # Seeding is setup: it always uses the default profile, so only the viewer's journey varies.
      - id: default
        journeys: { login: default, seed: default, viewer-login: default, pages: default }
      - id: keyboard-only
        journeys: { login: default, seed: default, viewer-login: keyboard-only, pages: keyboard-only }
