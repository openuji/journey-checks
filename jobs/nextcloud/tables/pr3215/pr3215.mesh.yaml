          - id: create-drafts
            client: owner
            method: POST
            path: /ocs/v2.php/apps/tables/api/2/contexts/{{context}}/pages
            json: { title: Drafts, slug: drafts }
        effects:
          urn:effect:page-cancel:nothing-saved: &no-widgets
            - id: read-drafts
              client: owner
              path: /ocs/v2.php/apps/tables/api/2/contexts/{{context}}/pages/drafts
              assertions:
                - pointer: /ocs/data/widgets
                  length: 0
          urn:effect:page-cancel:nothing-saved-after-discard: *no-widgets
