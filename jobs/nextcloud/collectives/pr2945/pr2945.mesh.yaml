                  - 200
                  - 404
          - id: create-bob
            client: provisioner
            method: POST
            path: /ocs/v2.php/cloud/users
            status:
              - 200
            json:
              userid: journey-bob
              password: JourneyFixture2026!
              displayName: Bob Journey
