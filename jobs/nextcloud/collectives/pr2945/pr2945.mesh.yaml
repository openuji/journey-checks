kind: suite
report:
  excludedPhaseIds:
    - urn:phase:setup
  interpreters:
    - use: "@openuji/journey-report-axe"
    - use: "@openuji/journey-report-operability"
label: Collectives sharing permissions
outputDir: out
target:
  service: collectives-install
  output: identity
model:
  use: "@openuji/journey-model-ujg/plugin"
services:
  collectives-source:
    use: "@openuji/journey-service-git/plugin"
    options:
      repository: https://github.com/nextcloud/collectives.git
      pullRequest: 2945
      directory: .tmp/collectives-source
  collectives-build:
    use: "@openuji/journey-vendor-nextcloud/app-build/service"
    inputs:
      source:
        service: collectives-source
        output: source
    options:
      directory: .runtime/builds
      image: journey-mesh/collectives
      nodeImage: node:24.11.1-bookworm-slim@sha256:48abc13a19400ca3985071e287bd405a1d99306770eb81d61202fb6b65cf0b57
      composerImage: composer:2.8.12@sha256:5248900ab8b5f7f880c2d62180e40960cd87f60149ec9a1abfd62ac72a02577c
  stack:
    use: "@openuji/journey-vendor-nextcloud/stack/service"
    options:
      project: journey-collectives-sharing
      composeFiles:
        - deployment/compose.yaml
      directory: .runtime/stack
      image: nextcloud:35.0.2-apache@sha256:786c102155d2717ba0f53a62b3fdd7a1354edc48e800b94dbe32294d9a5752a2
      expectedVersion: 35.0.2
      systemConfig:
        auth.bruteforce.protection.enabled: false
      environment:
        NEXTCLOUD_COLLECTIVES_PORT: ${NEXTCLOUD_COLLECTIVES_PORT:-18445}
      services:
        nextcloud:
          baseURL: http://host.docker.internal:${NEXTCLOUD_COLLECTIVES_PORT:-18445}
          username: admin
          password: JourneyAdmin2026!
      enabledApps:
        - circles
        - text
        - files_sharing
  collectives-install:
    use: "@openuji/journey-vendor-nextcloud/app-install/service"
    inputs:
      app:
        service: collectives-build
        output: app
      stack:
        service: stack
        output: stack
    options:
      directory: .runtime/install
      services:
        - nextcloud
      enable: true
executors:
  web:
    use: "@openuji/journey-executor-playwright/plugin"
    options:
      browser: chromium
      headless: ${HEADLESS:-true}
      contextOptions:
        viewport:
          width: 1440
          height: 1000
        locale: en-US
      # Nextcloud success toasts (role=status) expire after about 7 seconds, and their Close
      # buttons are tab stops at the end of the document. A keyboard walk starts only once none
      # is up, so the declared Shift+Tab counts do not depend on how fast the run is.
      # Nothing else in Collectives has this role.
      transientUi:
        - role: status
    client:
      use: "@openuji/journey-vendor-nextcloud/web/plugin"
      options:
        touchpoints:
          urn:touchpoint:collectives:
            baseURL: http://host.docker.internal:${NEXTCLOUD_COLLECTIVES_PORT:-18445}
        users:
          urn:user:owner:
            username: journey-owner
            password: JourneyFixture2026!
          urn:user:admin:
            username: journey-admin
            password: JourneyFixture2026!
          urn:user:alice:
            username: journey-alice
            password: JourneyFixture2026!
          urn:user:bob:
            username: journey-bob
            password: JourneyFixture2026!
        entries:
          login: /login
          collectives: /apps/collectives
        transitionValues:
          urn:journey:collective-own:login:transition:0:
            source: user.username
          urn:journey:collective-own:login:transition:1:
            source: user.password
          urn:journey:collective-own:sharing:transition:6: Newsletter
          urn:journey:collective-member:login:transition:0:
            source: user.username
          urn:journey:collective-member:login:transition:1:
            source: user.password
          urn:journey:collective-admin:login:transition:0:
            source: user.username
          urn:journey:collective-admin:login:transition:1:
            source: user.password
          urn:journey:collective-sharing-restricted:login:transition:0:
            source: user.username
          urn:journey:collective-sharing-restricted:login:transition:1:
            source: user.password
          urn:journey:collective-editing-restricted:login:transition:0:
            source: user.username
          urn:journey:collective-editing-restricted:login:transition:1:
            source: user.password
          urn:journey:page-own:login:transition:0:
            source: user.username
          urn:journey:page-own:login:transition:1:
            source: user.password
          urn:journey:page-own:sharing:transition:7: Newsletter
          urn:journey:page-member:login:transition:0:
            source: user.username
          urn:journey:page-member:login:transition:1:
            source: user.password
          urn:journey:page-admin:login:transition:0:
            source: user.username
          urn:journey:page-admin:login:transition:1:
            source: user.password
          urn:journey:page-sharing-restricted:login:transition:0:
            source: user.username
          urn:journey:page-sharing-restricted:login:transition:1:
            source: user.password
          urn:journey:page-editing-restricted:login:transition:0:
            source: user.username
          urn:journey:page-editing-restricted:login:transition:1:
            source: user.password
    observers:
      - use: "@openuji/journey-observer-operability/plugin"
        options:
          id: input-steps
      - use: "@openuji/journey-observer-axe/plugin"
        options:
          reportId: collectives-sharing.axe
          strict: false
          sourceScreenshots:
            states: true
            fullPage: true
          excludedPhaseIds:
            - urn:phase:setup
profiles:
  default:
    use: "@openuji/journey-profiles/plugin"
    options:
      preset: default
  keyboard-only:
    use: "@openuji/journey-profiles/plugin"
    options:
      preset: keyboard-only
tests:
