              client: public
              method: GET
              path: /index.php/s/{{aliceToken}}
              status:
                - 200
          urn:journey:page-editing-restricted:sharing:transition:10:effect:
            - id: not-listed
              client: owner
              method: GET
              path: /ocs/v2.php/apps/collectives/api/v1.0/collectives/{{collective}}/shares
              status:
                - 200
