            path: /ocs/v2.php/apps/collectives/api/v1.0/collectives/{{collective}}/shares
            status:
              - 200
            json:
              label: ""
            capture:
              aliceToken: /ocs/data/token
          - id: seed-bob-link
            client: bob
            method: POST
            path: /ocs/v2.php/apps/collectives/api/v1.0/collectives/{{collective}}/shares
