    timeoutMs: 600000
    services:
      - collectives-install
    journeys:
      - id: login
        source: ujg/collective-own.ujg.jsonld
        select: urn:journey:collective-own:login
        executor: web
      - id: sharing
        source: ujg/collective-own.ujg.jsonld
        select: urn:journey:collective-own:sharing
        executor: web
    profiles:
      - id: default
        journeys:
          login: default
          sharing: default
      - id: keyboard-only
        journeys:
          login: keyboard-only
          sharing: keyboard-only
    environment:
      use: "@openuji/journey-environment-http/plugin"
      options:
        clients: &a1
          provisioner:
            baseURL: http://host.docker.internal:${NEXTCLOUD_COLLECTIVES_PORT:-18445}
            headers:
              OCS-APIRequest: "true"
              Accept: application/json
            auth:
              username: admin
              password: JourneyAdmin2026!
          public:
            baseURL: http://host.docker.internal:${NEXTCLOUD_COLLECTIVES_PORT:-18445}
            headers:
              OCS-APIRequest: "true"
              Accept: application/json
          owner:
            baseURL: http://host.docker.internal:${NEXTCLOUD_COLLECTIVES_PORT:-18445}
            headers:
              OCS-APIRequest: "true"
              Accept: application/json
            auth:
              username: journey-owner
              password: JourneyFixture2026!
          admin:
            baseURL: http://host.docker.internal:${NEXTCLOUD_COLLECTIVES_PORT:-18445}
            headers:
              OCS-APIRequest: "true"
              Accept: application/json
            auth:
              username: journey-admin
              password: JourneyFixture2026!
          alice:
