              - 200
            json:
              label: Bob link
            capture:
              bobToken: /ocs/data/token
        effects:
          urn:journey:collective-own:sharing:transition:3:effect:
            - id: list-capabilities
              client: alice
              method: GET
              path: /ocs/v2.php/apps/collectives/api/v1.0/collectives/{{collective}}/shares
              status:
                - 200
              assertions:
                - pointer: /ocs/data
                  includes:
                    owner: journey-alice
                    canUpdate: true
                    canDelete: true
                - pointer: /ocs/data
                  length: 3
          urn:journey:collective-own:sharing:transition:7:effect:
            - id: updated
              client: alice
              method: GET
              path: /ocs/v2.php/apps/collectives/api/v1.0/collectives/{{collective}}/shares
              status:
                - 200
              poll: {}
              assertions:
                - pointer: /ocs/data
                  includes:
                    token: "{{aliceToken}}"
                    label: Newsletter
          urn:journey:collective-own:sharing:transition:9:effect:
            - id: created
              client: alice
              method: GET
              path: /ocs/v2.php/apps/collectives/api/v1.0/collectives/{{collective}}/shares
              status:
                - 200
              poll: {}
              assertions:
                - pointer: /ocs/data
                  length: 4
          urn:journey:collective-own:sharing:transition:11:effect:
            - id: collective-public-before
              client: public
              method: GET
              path: /ocs/v2.php/apps/collectives/api/v1.0/p/collectives/{{aliceToken}}
              status:
                - 200
            - id: folder-public-before
              client: public
              method: GET
              path: /index.php/s/{{aliceToken}}
              status:
                - 200
          urn:journey:collective-own:sharing:transition:12:effect:
            - id: not-listed
              client: owner
              method: GET
              path: /ocs/v2.php/apps/collectives/api/v1.0/collectives/{{collective}}/shares
              status:
                - 200
              poll: {}
              assertions:
                - pointer: /ocs/data
                  excludes:
                    token: "{{aliceToken}}"
            - id: collective-public-revoked
              client: public
              method: GET
              path: /ocs/v2.php/apps/collectives/api/v1.0/p/collectives/{{aliceToken}}
              status:
                - 404
            - id: folder-public-revoked
              client: public
              method: GET
              path: /index.php/s/{{aliceToken}}
              status:
                - 404
        cleanupTimeoutMs: 60000
