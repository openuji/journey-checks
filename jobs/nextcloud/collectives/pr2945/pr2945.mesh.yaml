            headers:
              OCS-APIRequest: "true"
              Accept: application/json
            auth:
              username: journey-bob
              password: JourneyFixture2026!
        setup:
          - id: create-owner
            client: provisioner
            method: POST
            path: /ocs/v2.php/cloud/users
            status:
              - 200
            json:
              userid: journey-owner
              password: JourneyFixture2026!
              displayName: Collective Owner
            cleanup:
              - id: delete-owner
                client: provisioner
                method: DELETE
                path: /ocs/v2.php/cloud/users/journey-owner
                status:
                  - 200
                  - 404
          - id: create-admin
            client: provisioner
            method: POST
            path: /ocs/v2.php/cloud/users
            status:
              - 200
            json:
              userid: journey-admin
              password: JourneyFixture2026!
              displayName: Collective Administrator
            cleanup:
              - id: delete-admin
                client: provisioner
                method: DELETE
                path: /ocs/v2.php/cloud/users/journey-admin
                status:
