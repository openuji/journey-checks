name: Check journeys

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      journey_mesh_ref:
        description: "journey-mesh tag, branch or SHA to run (default: latest v* tag)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: check-journeys
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List jobs
        id: jobs
        run: |
          jobs="$(find jobs -name '*.mesh.yaml' | sed 's|^jobs/||; s|/[^/]*$||' | sort -u | jq -R . | jq -sc .)"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "Jobs: $jobs"
      - name: Pick the journey-mesh version once for every job
        id: ref
        env:
          INPUT_REF: ${{ inputs.journey_mesh_ref }}
        run: |
          ref="${INPUT_REF:-$(scripts/latest-tag.sh)}"
          if [ "$ref" = main ] && [ -z "$INPUT_REF" ]; then
            echo "::warning::journey-mesh has no v* tag yet, running main"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "journey-mesh ref: $ref"

  check:
    needs: plan
    runs-on: ubuntu-latest
    # Native jobs build an APK and boot emulators before their journeys run.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      JOB: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openuji/journey-mesh
          ref: ${{ needs.plan.outputs.ref }}
          path: journey-mesh
          persist-credentials: false
      - name: Name the artifacts
        id: names
        run: echo "slug=${JOB//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Register the canonical web hostname
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      # Jobs whose mesh uses Android services build an APK with the host SDK and boot
      # emulators, which need KVM, the JDKs their Gradle builds pin, and SDK licenses.
      - name: Detect native requirements
        id: native
        run: |
          if grep -q '@openuji/journey-driver-android' "jobs/$JOB"/*.mesh.yaml; then echo "android=true" >> "$GITHUB_OUTPUT"; fi
      - name: Enable KVM for the Android emulator
        if: steps.native.outputs.android == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # JAVA_HOME is the last version (21); JAVA_HOME_17_X64 serves Gradle toolchains.
      - uses: actions/setup-java@v4
        if: steps.native.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Accept Android SDK licenses
        if: steps.native.outputs.android == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - uses: actions/cache@v4
        if: steps.native.outputs.android == 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ steps.names.outputs.slug }}-${{ github.run_id }}
          restore-keys: gradle-${{ steps.names.outputs.slug }}-
      # Builds journey-mesh (the tool), runs the job's mesh in place and always writes the
      # result. Exits nonzero when the job did not succeed, which turns this run red; the
      # steps below still run so the result is published either way.
      - name: Run the job
        env:
          JOURNEY_MESH_REF: ${{ needs.plan.outputs.ref }}
        run: scripts/run-job.sh "$JOB"
      - name: Show the result
        if: ${{ !cancelled() && hashFiles('site-part/**') != '' }}
        run: |
          { echo '```json'; cat "site-part/$JOB.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ steps.names.outputs.slug }}
          path: site-part
          if-no-files-found: error
      - name: Upload the report and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ steps.names.outputs.slug }}
          path: jobs/${{ matrix.job }}/out
          if-no-files-found: ignore
          retention-days: 30

  # Publishing is two jobs on purpose. With upload and deploy in one job, a failed deploy cannot
  # be rerun: the rerun uploads a second artifact with the same name, and deploy-pages refuses
  # to choose between them. Here a failed deploy is rerun alone, against the site built once.
  # To retry by hand, rerun only the "publish" job. "Re-run failed jobs" also reruns every red
  # check job.
  site:
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: site
          merge-multiple: true
      - name: Index every result
        run: |
          find site -name '*.json' ! -name index.json -print0 \
            | xargs -0 jq -s '{generatedAt: (now | todate), jobs: (map({key: .job, value: .}) | from_entries)}' \
            > site/index.json
          cat site/index.json
      # One artifact name per attempt, handed to the publish job as an output. Rerunning this
      # job can never leave two artifacts with the name the publish job looks for.
      - name: Name the site artifact
        id: names
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: echo "artifact=github-pages-$ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: site
          # Long enough to rerun the publish job the next day, which the default (1 day) is not.
          retention-days: 7

  # Pages sometimes fails a deployment it just accepted ("Deployment failed, try again later")
  # or lists artifacts a moment too early. Both pass on a retry, so a failed attempt waits and
  # tries again, and says so in a warning. Only the last attempt may fail the job.
  publish:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-3.outputs.page_url || steps.deploy-2.outputs.page_url || steps.deploy-1.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy-1
        continue-on-error: true
        with:
          artifact_name: ${{ needs.site.outputs.artifact }}
      - name: Wait before the second attempt
        if: ${{ steps.deploy-1.outcome == 'failure' }}
        run: |
          echo "::warning::The Pages deployment failed; trying again in 30 seconds"
          sleep 30
      - uses: actions/deploy-pages@v4
        id: deploy-2
        if: ${{ steps.deploy-1.outcome == 'failure' }}
        continue-on-error: true
        with:
          artifact_name: ${{ needs.site.outputs.artifact }}
      - name: Wait before the last attempt
        if: ${{ steps.deploy-2.outcome == 'failure' }}
        run: |
          echo "::warning::The Pages deployment failed again; the last attempt is in 90 seconds"
          sleep 90
      - uses: actions/deploy-pages@v4
        id: deploy-3
        if: ${{ steps.deploy-2.outcome == 'failure' }}
        with:
          artifact_name: ${{ needs.site.outputs.artifact }}
